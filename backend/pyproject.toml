[project]
name = "library-backend"
version = "1.0.0"
description = "图书管理系统后端（FastAPI + SQLAlchemy + SQLite）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
]
